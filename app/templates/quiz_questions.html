{% for q in catalog.questions + [none] %}<details{% if q is none %} open{% endif %}><summary>{{q.question if q else 'Neue Frage hinzufügen'}}</summary><form method="post" action="/assets/{{package.id}}/questions"><input type="hidden" name="expected" value="{{package.current_version}}"><input type="hidden" name="question_id" value="{{q.id if q else 0}}"><label>Frage<input name="question" value="{{q.question if q else ''}}" required maxlength="10000"></label>{% for i in range(4) %}<label>{{'Richtige Antwort' if i==0 else 'Falsche Antwort '+i|string}}<input name="answers" value="{{q.answers[i] if q else ''}}" required></label>{% endfor %}<label>Erklärung<textarea name="explanation">{{q.explanation if q else ''}}</textarea></label><label>Mindestalter<input type="number" name="min_age" min="0" max="120" value="{{q.min_age if q else 0}}"></label><label>Schwierigkeit (1–10)<input type="number" name="difficulty" min="1" max="10" value="{{q.difficulty if q else 1}}"></label><label>Tags, durch Kommas getrennt<input name="tags" value="{{q.tags|join(', ') if q else ''}}"></label><button>Frage speichern & Version erhöhen</button></form>{% if q %}<form method="post" action="/assets/{{package.id}}/questions/{{q.id}}/delete"><input type="hidden" name="expected" value="{{package.current_version}}"><button>Frage löschen & Version erhöhen</button></form>{% endif %}</details>{% endfor %}
