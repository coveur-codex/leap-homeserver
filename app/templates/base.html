<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>LEAP Home Server</title>
  <link rel="icon" href="/static/branding/favicon.ico?v=1" sizes="16x16 32x32 48x48 64x64">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/branding/favicon.png?v=1">
  <script src="/static/theme.js?v=1"></script>
  <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
  <header>
    <a class="brand-logo" href="/" aria-label="LEAP Homeserver – Startseite"><img src="/static/branding/leap-logo.png" alt="LEAP" width="108" height="72"></a>
    <nav><a href="/">Dashboard</a><a href="/devices">Geräte</a><a href="/news/feeds">News</a><a href="/assets">Assets</a><a href="/communication">Kommunikation</a><a href="/firmware">Firmware</a><a href="/system">System</a><a href="/docs">API</a></nav>
    <label class="theme-control" hidden for="theme-select">Design
      <select id="theme-select">
        <option value="light">Hell</option>
        <option value="dark">Dunkel</option>
        <option value="system">System</option>
      </select>
    </label>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
