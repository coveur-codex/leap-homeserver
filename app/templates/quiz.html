{% extends 'base.html' %}{% block content %}<h1>Quiz-Kataloge</h1><form method="post" action="/quiz/upload" enctype="multipart/form-data"><label>Name<input name="name" required></label><label>JSON-Datei<input name="file" type="file" accept="application/json" required></label><fieldset><legend>Geräte</legend>{% for d in devices %}<label><input type="checkbox" name="device_ids" value="{{d.id}}">{{d.name}}</label>{% endfor %}</fieldset><button>Importieren</button></form><h2>Kataloge</h2>{% for c in catalogs %}<article><b>{{c.name}}</b> · {{c.questions|length}} Fragen · {% if c.enabled %}aktiv{% else %}inaktiv{% endif %}</article>{% endfor %}{% endblock %}
